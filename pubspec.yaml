name: download_video_app
description: A real Flutter background download manager for direct HTTP/HTTPS files.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  background_downloader: ^9.6.1
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
