name: download_video_app
description: A Flutter download manager for direct files and public video/audio media links.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  background_downloader: ^9.5.9
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  path: ^1.9.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
